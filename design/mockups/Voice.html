<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>紧凑版 · 语音确认</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</head>
<body>
<div style="width: 480px; height: 800px; box-sizing: border-box; background: #fff; color: #000; font-family: 'JetBrains Mono', 'Noto Sans SC', monospace; font-weight: 500; display: flex; flex-direction: column">
<div style="height: 36px; padding: 0 14px; background: #000; color: #fff; display: flex; align-items: center; justify-content: space-between; font-size: 18px; font-weight: 700">
<span>codetalky</span>
<span>14:32 · 82%</span>
</div>
<div style="height: 50px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid #000">
<span style="font-size: 24px; font-weight: 800">firmware</span>
<span style="flex-grow: 1; font-size: 18px">claude · sonnet-5.5</span>
<span style="border: 2px solid #000; font-size: 18px; font-weight: 700; padding: 0 7px">语音</span>
</div>
<div style="flex: 1; min-height: 0; padding: 0 14px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 8px; margin-top: 10px"><span style="background: #000; color: #fff; font-size: 18px; font-weight: 700; padding: 0 7px">你说的</span><span style="flex: 1; height: 2px; background: #000"></span></div>
<div style="margin-top: 8px; border: 2px solid #000; padding: 12px 12px; font-family: 'Noto Sans SC', sans-serif; font-size: 24px; font-weight: 700; line-height: 34px">把刚才失败的两个测试修好，然后重新跑一遍。<span style="display: inline-block; width: 13px; height: 24px; margin-left: 5px; background: #000; vertical-align: -3px"></span></div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 12px"><span style="background: #000; color: #fff; font-size: 18px; font-weight: 700; padding: 0 7px">它现在</span><span style="flex: 1; height: 2px; background: #000"></span></div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 6px"><span style="flex-shrink: 0; border: 2px solid #000; font-size: 18px; font-weight: 700; padding: 0 5px">Edit</span><span style="flex: 1; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">display/epd_driver.c</span><span style="font-size: 20px; font-weight: 700">+18 −7</span></div>
<div style="margin-top: 4px; font-size: 18px">任务 3/5 · 正在写刷新计数器</div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 12px"><span style="background: #000; color: #fff; font-size: 18px; font-weight: 700; padding: 0 7px">它刚说</span><span style="flex: 1; height: 2px; background: #000"></span></div>
<p style="margin: 6px 0 0; font-family: 'Noto Sans SC', sans-serif; font-size: 20px; line-height: 27px">测试 5 个里有 2 个没过，都是局刷之后的残影检查。我先把计数器加上再重跑。</p>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 12px"><span style="background: #000; color: #fff; font-size: 18px; font-weight: 700; padding: 0 7px">发出去之后</span><span style="flex: 1; height: 2px; background: #000"></span></div>
<p style="margin: 6px 0 0; font-family: 'Noto Sans SC', sans-serif; font-size: 20px; line-height: 27px">这句话排在它当前这一步后面，不会打断正在进行的修改。</p>
</div>
<div style="height: 34px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 18px">
<span>豆包识别 · 20 个字</span>
<span>错了点重说，再按 BOOT</span>
</div>
<div style="height: 84px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-top: 3px solid #000">
<button style="flex: 1; height: 62px; background: #fff; border: 3px solid #000; font-size: 26px; font-weight: 800">重说</button>
<button style="flex: 1; height: 62px; background: #000; color: #fff; border: 3px solid #000; font-size: 26px; font-weight: 800">发送</button>
</div>
</div>
</body>
</html>
